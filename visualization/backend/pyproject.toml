[project]
name = "agentschool-visualization"
version = "0.1.0"
description = "Local replay and live visualization backend for AgentSchool"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "uvicorn[standard]>=0.30,<1",
  "openai>=1.68,<3",
  "python-dotenv>=1,<2",
  "resvg-py>=0.2,<1",
]

[project.optional-dependencies]
native = [
  "numpy>=1.26,<3",
  "aiofiles>=23,<26",
  "demjson3>=3,<4",
  "sentence-transformers>=3,<4",
  "langchain>=0.3,<0.4",
  "langchain-text-splitters>=0.3,<0.4",
  "hnswlib>=0.8,<0.9",
  "scikit-learn>=1.4,<2",
  "tiktoken>=0.8,<1",
]
test = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["agentschool_viz*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["../.."]
